<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Карманный фонарик</title>
<meta name="theme-color" content="#0b0f17">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;600&display=swap">
<style>
/* Layout: one screen, a single big round switch in the middle, mode picker and status under it. Night-dark by design; "screen light" turns the whole page white. */
:root {
  --night: #0b0f17;
  --night-2: #141b28;
  --line: #263044;
  --text: #e9edf5;
  --muted: #8a95ab;
  --lamp: #ffd76a;
  --lamp-glow: rgba(255, 215, 106, .45);
  --white: #ffffff;
  --ink: #1a1f2b;
  --f-display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body {
  background: var(--night);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 15px;
  -webkit-tap-highlight-color: transparent;
  overflow: hidden;
  transition: background .25s ease;
}
.app {
  box-sizing: border-box;
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding-block: 20px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  max-width: 480px;
  margin: 0 auto;
}
header { text-align: center; }
h1 {
  margin: 0;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 1.25rem;
  letter-spacing: .02em;
  text-wrap: balance;
}
.sub { margin: 6px 0 0; color: var(--muted); font-size: .9rem; }

.stage { display: grid; place-items: center; }
.switch {
  position: relative;
  width: min(62vmin, 250px);
  aspect-ratio: 1;
  max-width: 100%;
  border-radius: 50%;
  border: 2px solid var(--line);
  background: radial-gradient(circle at 50% 35%, var(--night-2), var(--night) 70%);
  color: var(--muted);
  cursor: pointer;
  display: grid;
  place-items: center;
  box-shadow: inset 0 -10px 30px rgba(0,0,0,.5), 0 10px 40px rgba(0,0,0,.45);
  transition: transform .12s ease, box-shadow .3s ease, color .3s ease, border-color .3s ease;
  touch-action: manipulation;
}
.switch:active { transform: scale(.97); }
.switch:focus-visible { outline: 3px solid var(--lamp); outline-offset: 6px; }
.switch svg { width: 38%; height: 38%; }
.switch .label {
  position: absolute;
  bottom: 18%;
  font-family: var(--f-display);
  font-size: .8rem;
  letter-spacing: .18em;
  text-transform: uppercase;
}
.switch[aria-pressed="true"] {
  color: var(--lamp);
  border-color: var(--lamp);
  box-shadow: 0 0 0 10px rgba(255,215,106,.08), 0 0 80px var(--lamp-glow), inset 0 0 40px rgba(255,215,106,.15);
}
.switch.busy { opacity: .6; }

.controls { display: grid; gap: 14px; justify-items: center; }
.modes {
  display: inline-flex;
  padding: 4px;
  gap: 4px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--night-2);
}
.modes button {
  font: 600 .9rem var(--f-body);
  color: var(--muted);
  background: transparent;
  border: 0;
  border-radius: 999px;
  padding: 9px 18px;
  cursor: pointer;
}
.modes button[aria-checked="true"] { background: var(--text); color: var(--night); }
.modes button:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.status {
  min-height: 2.6em;
  margin: 0;
  text-align: center;
  color: var(--muted);
  font-size: .88rem;
  line-height: 1.4;
  max-width: 34ch;
  text-wrap: balance;
}

/* Screen light: the whole page becomes a lamp */
body.screen-on { background: var(--white); }
body.screen-on .app > header,
body.screen-on .controls { visibility: hidden; }
body.screen-on .switch {
  background: var(--white);
  border-color: rgba(0,0,0,.08);
  color: var(--ink);
  box-shadow: none;
}
.hint-off {
  position: fixed;
  left: 0; right: 0;
  bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  text-align: center;
  color: rgba(0,0,0,.35);
  font-size: .85rem;
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>


<div class="app">
  <header>
    <h1>Фонарик</h1>
    <p class="sub">Нажмите на кнопку, чтобы включить свет</p>
  </header>

  <div class="stage">
    <button id="power" class="switch" type="button" aria-pressed="false" aria-label="Включить фонарик">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M12 3v8"/>
        <path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>
      </svg>
      <span class="label" id="powerLabel">Вкл</span>
    </button>
  </div>

  <div class="controls">
    <div class="modes" role="radiogroup" aria-label="Источник света">
      <button id="modeTorch" type="button" role="radio" aria-checked="true">Фонарик</button>
      <button id="modeScreen" type="button" role="radio" aria-checked="false">Экран</button>
    </div>
    <p class="status" id="status" aria-live="polite">Фонарик телефона. Браузер спросит доступ к камере: лампочка фонарика стоит рядом с ней, без этого её не включить.</p>
  </div>
</div>
<p class="hint-off" id="hintOff" hidden>Нажмите кнопку, чтобы выключить</p>

<script>
(() => {
  const power = document.getElementById('power');
  const powerLabel = document.getElementById('powerLabel');
  const statusEl = document.getElementById('status');
  const hintOff = document.getElementById('hintOff');
  const modeTorch = document.getElementById('modeTorch');
  const modeScreen = document.getElementById('modeScreen');

  let mode = 'torch';      // 'torch' | 'screen'
  let on = false;
  let busy = false;
  let track = null;        // camera track that has a torch
  let wakeLock = null;

  const say = (t) => { statusEl.textContent = t; };

  async function setMode(m) {
    if (m === mode || busy) return;
    const wasOn = on;
    if (on) await turnOff();
    mode = m;
    modeTorch.setAttribute('aria-checked', String(m === 'torch'));
    modeScreen.setAttribute('aria-checked', String(m === 'screen'));
    say(m === 'torch'
      ? 'Фонарик телефона. Браузер спросит доступ к камере: лампочка фонарика стоит рядом с ней, без этого её не включить.'
      : 'Экран станет белым и будет светить. Яркость экрана лучше поднять на максимум.');
    if (wasOn) turnOn();
  }

  function render() {
    power.setAttribute('aria-pressed', String(on));
    power.setAttribute('aria-label', on ? 'Выключить фонарик' : 'Включить фонарик');
    powerLabel.textContent = on ? 'Выкл' : 'Вкл';
    power.classList.toggle('busy', busy);
    const screenOn = on && mode === 'screen';
    document.body.classList.toggle('screen-on', screenOn);
    hintOff.hidden = !screenOn;
  }

  async function keepAwake(want) {
    try {
      if (want && 'wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
      } else if (!want && wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }
    } catch (e) { /* not allowed here — fine */ }
  }

  function hasTorch(t) {
    try { const c = t.getCapabilities ? t.getCapabilities() : {}; return !!c.torch; }
    catch (e) { return false; }
  }

  async function openTorchTrack() {
    if (track && track.readyState === 'live') return track;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('nomedia');

    // First try the rear camera
    let stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } });
    let t = stream.getVideoTracks()[0];
    if (hasTorch(t)) return (track = t);
    stream.getTracks().forEach(x => x.stop());

    // Some phones have several rear cameras and only one has the flash: try each
    const devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
    for (const d of devices.reverse()) {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { deviceId: { exact: d.deviceId } } });
        t = stream.getVideoTracks()[0];
        if (hasTorch(t)) return (track = t);
        stream.getTracks().forEach(x => x.stop());
      } catch (e) { /* try next */ }
    }
    throw new Error('notorch');
  }

  function releaseTrack() {
    if (track) { try { track.stop(); } catch (e) {} track = null; }
  }

  async function turnOn() {
    if (mode === 'screen') {
      on = true; render(); keepAwake(true);
      return;
    }
    busy = true; render();
    try {
      const t = await openTorchTrack();
      await t.applyConstraints({ advanced: [{ torch: true }] });
      on = true;
      say('Фонарик включён.');
    } catch (e) {
      releaseTrack();
      const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
      // Fall back to the screen so the button always gives light
      mode = 'screen';
      modeTorch.setAttribute('aria-checked', 'false');
      modeScreen.setAttribute('aria-checked', 'true');
      on = true;
      keepAwake(true);
      say(denied
        ? 'Нет доступа к камере, поэтому светит экран. Разрешите камеру в настройках сайта, чтобы включался фонарик.'
        : 'Этот браузер не умеет включать фонарик телефона, поэтому светит экран. Фонарик работает в Chrome на Android.');
    } finally {
      busy = false; render();
    }
  }

  async function turnOff() {
    if (mode === 'torch' && track) {
      try { await track.applyConstraints({ advanced: [{ torch: false }] }); } catch (e) {}
      releaseTrack();
      say('Фонарик выключен.');
    }
    on = false;
    keepAwake(false);
    render();
  }

  power.addEventListener('click', () => {
    if (busy) return;
    on ? turnOff() : turnOn();
  });
  modeTorch.addEventListener('click', () => setMode('torch'));
  modeScreen.addEventListener('click', () => setMode('screen'));

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && on && mode === 'torch') turnOff();
    if (!document.hidden && on && mode === 'screen') keepAwake(true);
  });

  render();
})();
</script>
</body>
</html>
